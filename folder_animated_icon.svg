<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- 漸層色彩設定 -->
    <linearGradient id="folderBackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="folderFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- 立體陰影濾鏡 -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>

    <filter id="docShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1E293B" flood-opacity="0.18" />
    </filter>
  </defs>

  <style>
    .folder-wrapper {
      cursor: pointer;
    }

    /* 地面陰影縮放與透明度變化 */
    .shadow {
      transform-origin: 100px 175px;
      animation: shadowAnim 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* 次要文件升降與旋轉動畫 */
    .doc-sub {
      transform-origin: 100px 120px;
      animation: docSubAnim 3.5s cubic-bezier(0.34, 1.4, 0.64, 1) infinite;
    }

    /* 主要文件彈出與旋轉動畫 */
    .doc-main {
      transform-origin: 100px 120px;
      animation: docMainAnim 3.5s cubic-bezier(0.34, 1.4, 0.64, 1) infinite;
    }

    /* 資料夾前蓋開啟角度與透視動畫 */
    .folder-front-group {
      transform-origin: 100px 158px;
      animation: frontFlapAnim 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* 動畫關鍵格定義 */
    @keyframes frontFlapAnim {
      0%, 12% {
        transform: skewX(0deg) scaleY(1) translateY(0);
      }
      40%, 72% {
        transform: skewX(-14deg) scaleY(0.65) translateY(20px);
      }
      90%, 100% {
        transform: skewX(0deg) scaleY(1) translateY(0);
      }
    }

    @keyframes docMainAnim {
      0%, 12% {
        transform: translateY(0px) rotate(0deg);
      }
      40%, 72% {
        transform: translateY(-54px) rotate(-4deg);
      }
      90%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
    }

    @keyframes docSubAnim {
      0%, 12% {
        transform: translateY(0px) rotate(0deg);
      }
      40%, 72% {
        transform: translateY(-38px) rotate(5deg);
      }
      90%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
    }

    @keyframes shadowAnim {
      0%, 12% {
        transform: scaleX(1);
        opacity: 0.35;
      }
      40%, 72% {
        transform: scaleX(1.22);
        opacity: 0.18;
      }
      90%, 100% {
        transform: scaleX(1);
        opacity: 0.35;
      }
    }
  </style>

  <g class="folder-wrapper">
    <!-- 地面投影 -->
    <ellipse class="shadow" cx="100" cy="175" rx="66" ry="7.5" fill="#0F172A" opacity="0.35" />

    <!-- 資料夾後背背板 -->
    <path class="folder-back" d="M 32,65 
             L 78,65 
             Q 84,65 88,70 
             L 98,80 
             Q 102,83 108,83 
             L 168,83 
             A 8,8 0 0 1 176,91 
             L 176,155 
             A 8,8 0 0 1 168,163 
             L 32,163 
             A 8,8 0 0 1 24,155 
             L 24,73 
             A 8,8 0 0 1 32,65 Z" 
          fill="url(#folderBackGrad)" />

    <!-- 次要文件（後方襯底紙張） -->
    <g class="doc-sub">
      <rect x="50" y="68" width="98" height="82" rx="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" />
      <rect x="60" y="80" width="46" height="4" rx="2" fill="#94A3B8" />
      <rect x="60" y="90" width="78" height="3" rx="1.5" fill="#CBD5E1" />
      <rect x="60" y="98" width="62" height="3" rx="1.5" fill="#CBD5E1" />
    </g>

    <!-- 主要文件（向上彈出的主文件） -->
    <g class="doc-main" filter="url(#docShadow)">
      <!-- 文件紙張本體 -->
      <rect x="44" y="56" width="112" height="96" rx="8" fill="url(#docGrad)" stroke="#E2E8F0" stroke-width="1" />
      
      <!-- 文件頂部橘紅色條紋裝飾 -->
      <rect x="56" y="68" width="38" height="6" rx="3" fill="url(#accentGrad)" />
      
      <!-- 文件頂部藍色標籤圖示 -->
      <circle cx="140" cy="71" r="5" fill="#3B82F6" />
      
      <!-- 文章內容模擬線條 -->
      <rect x="56" y="82" width="88" height="4" rx="2" fill="#64748B" />
      <rect x="56" y="92" width="74" height="3.5" rx="1.75" fill="#94A3B8" />
      <rect x="56" y="100" width="80" height="3.5" rx="1.75" fill="#CBD5E1" />
      <rect x="56" y="108" width="52" height="3.5" rx="1.75" fill="#CBD5E1" />

      <!-- 文件右下角統計圖表示意圖 -->
      <g transform="translate(118, 104)">
        <rect x="0" y="8" width="5" height="10" rx="1" fill="#3B82F6" />
        <rect x="8" y="3" width="5" height="15" rx="1" fill="#10B981" />
        <rect x="16" y="0" width="5" height="18" rx="1" fill="#F59E0B" />
      </g>
    </g>

    <!-- 資料夾前蓋群組 -->
    <g class="folder-front-group" filter="url(#dropShadow)">
      <path d="M 24,96 
               L 176,96 
               A 8,8 0 0 1 184,104 
               L 174,157 
               A 8,8 0 0 1 166,164 
               L 34,164 
               A 8,8 0 0 1 26,157 
               L 16,104 
               A 8,8 0 0 1 24,96 Z" 
            fill="url(#folderFrontGrad)" />
      
      <!-- 前蓋邊緣高光反光線 -->
      <path d="M 25,97 L 175,97" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    </g>
  </g>
</svg>